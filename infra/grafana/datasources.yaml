# Replaces the copy baked into grafana/otel-lgtm (bind-mounted over
# grafana-datasources.yaml). Copied from the image and changed in exactly one place - the
# tracesToLogsV2 time shifts on the Tempo datasource - so an image upgrade diff stays readable.
#
# Why: "Related logs" on a span was returning nothing. Without a shift, Grafana clamps the Loki
# lookup to the span's own start and end - a 49ms window for a typical gateway request. The access
# log is written in doFinally, at or just after the span closes, and Loki stamps it from the OTLP
# observed time, so it lands microseconds outside the window. The query was always right; it was
# being asked about the wrong 49 milliseconds.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://127.0.0.1:9090
    editable: true
    jsonData:
      timeInterval: 60s
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
          urlDisplayLabel: "Trace: $${__value.raw}"

  - name: Tempo
    type: tempo
    uid: tempo
    url: http://127.0.0.1:3200
    editable: true
    jsonData:
      tracesToLogsV2:
        customQuery: true
        datasourceUid: "loki"
        query: '{$${__tags}} | trace_id = "$${__trace.traceId}"'
        tags:
          - key: "service.name"
            value: "service_name"
        # The whole point of this file. Generous on purpose: the query already pins an exact
        # trace_id, so a wider window cannot pull in unrelated logs - it can only stop excluding
        # the right ones.
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"

      serviceMap:
        datasourceUid: "prometheus"
      search:
        hide: false
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: "loki"

  - name: Loki
    type: loki
    uid: loki
    url: http://127.0.0.1:3100
    editable: true
    jsonData:
      # Verified working: this renders a "Trace: <id>" link under Links in an expanded log row,
      # and it jumps to Tempo. It is not shown next to the trace_id value in the fields list -
      # that spot only offers copy/filter, which is easy to mistake for a broken link.
      derivedFields:
        - name: "trace_id"
          matcherType: "label"
          matcherRegex: "trace_id"
          url: "$${__value.raw}"
          datasourceUid: "tempo"
          urlDisplayLabel: "Trace: $${__value.raw}"

  - name: Pyroscope
    type: grafana-pyroscope-datasource
    uid: pyroscope
    url: http://127.0.0.1:4040
