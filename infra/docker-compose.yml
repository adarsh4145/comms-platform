
networks:
  comms-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:

  mongo:
    image: mongo:8.3.8
    container_name: comms-mongo
    networks:
      comms-net:
        ipv4_address: 172.28.0.10
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    entrypoint: ["bash", "/scripts/mongo-entrypoint.sh"]
    volumes:
      - ./data/mongo_data:/data/db
      - mongo_keyfile:/keyfile
      - ./scripts:/scripts:ro

  mongo-init:
    image: mongo:8.3.8
    container_name: comms-mongo-init
    networks:
      - comms-net
    depends_on:
      - mongo
    restart: "no"
    entrypoint: ["bash", "/scripts/mongo-init.sh"]
    volumes:
      - ./scripts:/scripts:ro

  # mongo-express:
  #   image: mongo-express:latest
  #   container_name: comms-mongo-express
  #   networks:
  #     comms-net:
  #       ipv4_address: 172.28.0.11
  #   ports:
  #     - "8091:8081"
  #   environment:
  #     ME_CONFIG_MONGODB_ADMINUSERNAME: admin
  #     ME_CONFIG_MONGODB_ADMINPASSWORD: admin
  #     ME_CONFIG_MONGODB_SERVER: mongo
  #   depends_on:
  #     - mongo
  # Replaced by DBGate below (single UI for Postgres + Mongo + Redis)

  postgres:
    image: postgres:18
    container_name: comms-postgres
    networks:
      comms-net:
        ipv4_address: 172.28.0.20
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: comms_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./data/postgres_data:/var/lib/postgresql

  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: comms-pgadmin
  #   networks:
  #     comms-net:
  #       ipv4_address: 172.28.0.21
  #   ports:
  #     - "8092:80"
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@comms.local
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   volumes:
  #     - pgadmin_data:/var/lib/pgadmin
  #   depends_on:
  #     - postgres
  # Replaced by DBGate below (single UI for Postgres + Mongo + Redis)

  redis:
    image: redis:8.10.1
    container_name: comms-redis
    networks:
      comms-net:
        ipv4_address: 172.28.0.30
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis_data:/data
    command: redis-server --appendonly yes

  # redisinsight:
  #   image: redis/redisinsight:latest
  #   container_name: comms-redisinsight
  #   networks:
  #     comms-net:
  #       ipv4_address: 172.28.0.31
  #   ports:
  #     - "8093:5540"
  #   volumes:
  #     - redisinsight_data:/data
  #   depends_on:
  #     - redis
  # Replaced by DBGate below (single UI for Postgres + Mongo + Redis)

  dbgate:
    image: dbgate/dbgate:7.2.5
    container_name: comms-dbgate
    networks:
      comms-net:
        ipv4_address: 172.28.0.60
    ports:
      - "8094:3000"
    environment:
      CONNECTIONS: postgres,mongo,redis

      LABEL_postgres: Postgres (comms-platform)
      SERVER_postgres: postgres
      USER_postgres: postgres
      PASSWORD_postgres: postgres
      PORT_postgres: 5432
      ENGINE_postgres: postgres@dbgate-plugin-postgres

      LABEL_mongo: Mongo (comms-platform)
      URL_mongo: mongodb://admin:admin@mongo:27017/?replicaSet=rs0
      ENGINE_mongo: mongo@dbgate-plugin-mongo

      LABEL_redis: Redis (comms-platform)
      URL_redis: redis://redis:6379
      ENGINE_redis: redis@dbgate-plugin-redis
    volumes:
      - ./data/dbgate_data:/root/.dbgate
    depends_on:
      - postgres
      - mongo
      - redis

  kafka:
    image: apache/kafka:4.3.1
    container_name: comms-kafka
    networks:
      comms-net:
        ipv4_address: 172.28.0.40
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://comms-kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@comms-kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Topics are provisioned explicitly by the Spring Cloud Stream binder AdminClient,
      # so a typo'd destination should fail loudly rather than silently create a topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - ./data/kafka_data:/var/lib/kafka/data

  # Topic partitions are weighted by priority - see scripts/kafka-init.sh. KAFKA_PARTITION_UNIT
  # scales the whole set (1 gives 4/3/2/1, 2 gives 8/6/4/2); raise consumer concurrency with it or
  # the extra partitions sit idle. KAFKA_RECREATE_TOPICS=true drops and rebuilds topics whose
  # partition count no longer matches - destructive, development only.
  # Topic partitions are weighted by priority - see scripts/kafka-init.sh. KAFKA_PARTITION_UNIT
  # scales the whole set (1 gives 4/3/2/1, 2 gives 8/6/4/2); raise consumer concurrency with it,
  # or the extra partitions just sit idle. KAFKA_RECREATE_TOPICS=true drops and rebuilds topics
  # whose partition count no longer matches - destructive, development only.
  kafka-init:
    image: apache/kafka:4.3.1
    container_name: comms-kafka-init
    networks:
      - comms-net
    depends_on:
      - kafka
    restart: "no"
    environment:
      KAFKA_PARTITION_UNIT: ${KAFKA_PARTITION_UNIT:-1}
      KAFKA_RECREATE_TOPICS: ${KAFKA_RECREATE_TOPICS:-false}
    entrypoint: ["bash", "/scripts/kafka-init.sh"]
    volumes:
      - ./scripts:/scripts:ro

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
#    image: provectuslabs/kafka-ui:v0.7.2
    container_name: comms-kafka-ui
    networks:
      comms-net:
        ipv4_address: 172.28.0.41
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: comms-kafka:29092
    depends_on:
      - kafka

#  mailpit:
#    image: axllent/mailpit:v1.31
#    container_name: comms-mailpit
#    networks:
#      comms-net:
#        ipv4_address: 172.28.0.50
#    ports:
#      - "1025:1025"
#      - "8025:8025"
#    environment:
#      MP_SMTP_AUTH_ACCEPT_ANY: "1"
#      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
#    volumes:
#      - ./data/mailpit_data:/data

  buggregator:
    image: ghcr.io/buggregator/server:2.4.1
    container_name: comms-buggregator
    networks:
      comms-net:
        ipv4_address: 172.28.0.51
    ports:
      - "8000:8000"   # Web UI + SMS interceptor (http://localhost:8000/sms/{provider})
      - "1025:1025"   # SMTP — email capture


  # Traces (Tempo) + logs (Loki) + metrics (Prometheus) + Grafana, in one dev container.
  # Traces and logs are pushed here over OTLP/HTTP on :4318; metrics are pulled the other way,
  # by the scrape jobs in ./prometheus.yaml. Read it all back in Grafana on :3000.
  lgtm:
    image: grafana/otel-lgtm:0.32.0
    container_name: comms-lgtm
    networks:
      comms-net:
        ipv4_address: 172.28.0.70
    ports:
      - "3000:3000"   # Grafana UI — Explore > Tempo
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP  (what the services are configured to use)
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Retention. Each component wants it in its own dialect, so it is spelled out three times
      # rather than hidden behind an alias. One day locally; the deployed profile can raise it.
      PROMETHEUS_EXTRA_ARGS: --storage.tsdb.retention.time=${TELEMETRY_RETENTION:-24h}
      LOKI_EXTRA_ARGS: -compactor.retention-enabled=true -compactor.delete-request-store=filesystem -store.retention=${TELEMETRY_RETENTION:-24h}
      TEMPO_EXTRA_ARGS: -backend-scheduler.provider.work.compaction.block-retention=${TELEMETRY_RETENTION:-24h} -backend-worker.compaction.block-retention=${TELEMETRY_RETENTION:-24h}
    extra_hosts:
      # The Spring apps run on the host, not in this network, and Prometheus has to scrape them.
      - "host.docker.internal:host-gateway"
    volumes:
      # Bind-mounted alongside every other service data directory rather than a named volume,
      # so all local state lives in one place you can see and clear. This is also what makes the
      # retention settings above meaningful - before it, every restart wiped the lot anyway.
      #
      # Note it persists Grafana itself too: the image puts GF_PATHS_DATA under /data, so starred
      # dashboards and annotations survive. Provisioned dashboards stay file-owned regardless.
      - ./data/lgtm:/data
      - ./prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      - ./prometheus-rules.yaml:/otel-lgtm/comms-rules.yaml:ro
      - ./grafana/dashboards:/etc/comms-dashboards:ro
      - ./grafana/dashboards-provider.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/comms-platform.yaml:ro
      - ./grafana/datasources.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/grafana-datasources.yaml:ro

  # Exporters. Each one turns a server that speaks its own protocol into a Prometheus endpoint,
  # and each has a community dashboard provisioned against it under ./grafana/dashboards.

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: comms-kafka-exporter
    # exporters race their server on a cold start and most of them exit rather than retry
    restart: unless-stopped
    networks:
      comms-net:
        ipv4_address: 172.28.0.80
    command: ["--kafka.server=comms-kafka:29092"]
    depends_on:
      - kafka

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    container_name: comms-postgres-exporter
    # exporters race their server on a cold start and most of them exit rather than retry
    restart: unless-stopped
    networks:
      comms-net:
        ipv4_address: 172.28.0.81
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:postgres@comms-postgres:5432/comms_platform?sslmode=disable
    depends_on:
      - postgres

  mongodb-exporter:
    image: percona/mongodb_exporter:0.44
    container_name: comms-mongodb-exporter
    # exporters race their server on a cold start and most of them exit rather than retry
    restart: unless-stopped
    networks:
      comms-net:
        ipv4_address: 172.28.0.82
    # compatible-mode emits the legacy mongodb_mongod_* metric names the community dashboards
    # were written against; without it every panel on dashboard 2583 is empty.
    command: ["--mongodb.uri=mongodb://admin:admin@comms-mongo:27017/?authSource=admin", "--collect-all", "--compatible-mode"]
    depends_on:
      - mongo

  redis-exporter:
    image: oliver006/redis_exporter:v1.90.0
    container_name: comms-redis-exporter
    # exporters race their server on a cold start and most of them exit rather than retry
    restart: unless-stopped
    networks:
      comms-net:
        ipv4_address: 172.28.0.83
    environment:
      REDIS_ADDR: redis://comms-redis:6379
    depends_on:
      - redis

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: comms-cadvisor
    networks:
      comms-net:
        ipv4_address: 172.28.0.84
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

volumes:
  mongo_keyfile: