spring:
  application:
    name: cloudGateway
  config:
    import: configserver:${CONFIG_SERVER_URL:http://localhost:8888}


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

