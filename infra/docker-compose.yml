version: "3.9"

networks:
  comms-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:

  mongo:
    image: mongo:8.3.8
    container_name: comms-mongo
    networks:
      comms-net:
        ipv4_address: 172.28.0.10
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    entrypoint: >
      bash -c '
        if [ ! -f /keyfile/mongo-keyfile ]; then
          openssl rand -base64 756 > /keyfile/mongo-keyfile
          chmod 400 /keyfile/mongo-keyfile
          chown mongodb:mongodb /keyfile/mongo-keyfile
        fi
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /keyfile/mongo-keyfile
      '
    volumes:
      - ./data/mongo_data:/data/db
      - mongo_keyfile:/keyfile

  # mongo-express:
  #   image: mongo-express:latest
  #   container_name: comms-mongo-express
  #   networks:
  #     comms-net:
  #       ipv4_address: 172.28.0.11
  #   ports:
  #     - "8091:8081"
  #   environment:
  #     ME_CONFIG_MONGODB_ADMINUSERNAME: admin
  #     ME_CONFIG_MONGODB_ADMINPASSWORD: admin
  #     ME_CONFIG_MONGODB_SERVER: mongo
  #   depends_on:
  #     - mongo
  # Replaced by DBGate below (single UI for Postgres + Mongo + Redis)

  postgres:
    image: postgres:18
    container_name: comms-postgres
    networks:
      comms-net:
        ipv4_address: 172.28.0.20
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: comms_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./data/postgres_data:/var/lib/postgresql

  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: comms-pgadmin
  #   networks:
  #     comms-net:
  #       ipv4_address: 172.28.0.21
  #   ports:
  #     - "8092:80"
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@comms.local
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   volumes:
  #     - pgadmin_data:/var/lib/pgadmin
  #   depends_on:
  #     - postgres
  # Replaced by DBGate below (single UI for Postgres + Mongo + Redis)

  redis:
    image: redis:8.10.1
    container_name: comms-redis
    networks:
      comms-net:
        ipv4_address: 172.28.0.30
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis_data:/data
    command: redis-server --appendonly yes

  # redisinsight:
  #   image: redis/redisinsight:latest
  #   container_name: comms-redisinsight
  #   networks:
  #     comms-net:
  #       ipv4_address: 172.28.0.31
  #   ports:
  #     - "8093:5540"
  #   volumes:
  #     - redisinsight_data:/data
  #   depends_on:
  #     - redis
  # Replaced by DBGate below (single UI for Postgres + Mongo + Redis)

  dbgate:
    image: dbgate/dbgate:7.2.5
    container_name: comms-dbgate
    networks:
      comms-net:
        ipv4_address: 172.28.0.60
    ports:
      - "8094:3000"
    environment:
      CONNECTIONS: postgres,mongo,redis

      LABEL_postgres: Postgres (comms-platform)
      SERVER_postgres: postgres
      USER_postgres: postgres
      PASSWORD_postgres: postgres
      PORT_postgres: 5432
      ENGINE_postgres: postgres@dbgate-plugin-postgres

      LABEL_mongo: Mongo (comms-platform)
      URL_mongo: mongodb://admin:admin@mongo:27017/?replicaSet=rs0
      ENGINE_mongo: mongo@dbgate-plugin-mongo

      LABEL_redis: Redis (comms-platform)
      URL_redis: redis://redis:6379
      ENGINE_redis: redis@dbgate-plugin-redis
    volumes:
      - ./data/dbgate_data:/root/.dbgate
    depends_on:
      - postgres
      - mongo
      - redis

  kafka:
    image: apache/kafka:4.3.1
    container_name: comms-kafka
    networks:
      comms-net:
        ipv4_address: 172.28.0.40
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://comms-kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@comms-kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
#     KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - ./data/kafka_data:/var/lib/kafka/data

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
#    image: provectuslabs/kafka-ui:v0.7.2
    container_name: comms-kafka-ui
    networks:
      comms-net:
        ipv4_address: 172.28.0.41
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: comms-kafka:29092
    depends_on:
      - kafka

#  mailpit:
#    image: axllent/mailpit:v1.31
#    container_name: comms-mailpit
#    networks:
#      comms-net:
#        ipv4_address: 172.28.0.50
#    ports:
#      - "1025:1025"
#      - "8025:8025"
#    environment:
#      MP_SMTP_AUTH_ACCEPT_ANY: "1"
#      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
#    volumes:
#      - ./data/mailpit_data:/data

  buggregator:
    image: ghcr.io/buggregator/server:latest
    container_name: comms-buggregator
    networks:
      comms-net:
        ipv4_address: 172.28.0.51
    ports:
      - "8000:8000"   # Web UI + SMS interceptor (http://localhost:8000/sms/{provider})
      - "1025:1025"   # SMTP — email capture

volumes:
  mongo_keyfile: