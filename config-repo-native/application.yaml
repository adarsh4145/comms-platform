greeting.message: Hello from local/ native

spring:
  reactor:
    # Restores tracing/MDC ThreadLocals across reactive operator boundaries.
    # Without this the trace context is lost the moment work hops threads.
    context-propagation: auto

management:
  tracing:
    enabled: true
    propagation:
      type: w3c
    sampling:
      # 1.0 for local development. Dial this down before anything resembling load.
      probability: 1.0
  opentelemetry:
    resource-attributes:
      deployment.environment: local
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
          transport: http
    logging:
      export:
        otlp:
          # Same collector, different signal path. Without this the OTLP log exporter is never
          # created and Grafana shows traces with no logs beside them.
          endpoint: http://localhost:4318/v1/logs
          transport: http
  # Metrics are scraped from /actuator/prometheus instead of pushed over OTLP - every
  # community Grafana dashboard is written against the Prometheus registry naming, and the
  # OTLP registry emits different metric names (http_server_requests_milliseconds_*).
  otlp:
    metrics:
      export:
        enabled: false
  metrics:
    tags:
      # dashboards 4701/12900/19004 all pivot on an "application" label
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,env,metrics,prometheus

logging:
  pattern:
    correlation: "[${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}] "
