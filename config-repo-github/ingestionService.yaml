spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://admin:admin@comms-mongo:27017/comms_platform?authSource=admin&replicaSet=rs0}
    redis:
      host: ${REDIS_HOST:comms-redis}
      port: ${REDIS_PORT:6379}

  cloud:
    # Consumes the delivery outcome dispatchService publishes, so a NotificationRequest
    # finally moves off RECEIVED to SENT/FAILED.
    function:
      definition: notificationDeliveryStatus
    stream:
      kafka:
        binder:
          # emits Kafka producer/consumer spans and injects traceparent into record headers
          enable-observation: true
          # Provision topics deterministically through the binder AdminClient instead of
          # leaning on the broker auto-create flag. 4 partitions so the CRITICAL consumer
          # (concurrency 4) can actually use all of its threads.
          auto-create-topics: true
          min-partition-count: 4
          replication-factor: 1
          # StreamBridge sets a String message key; the binder defaults to ByteArraySerializer,
          # which fails every send with "Cant convert key of class java.lang.String"
          producer-properties:
            key.serializer: org.apache.kafka.common.serialization.StringSerializer
          brokers: ${KAFKA_BROKERS:comms-kafka:29092}
      bindings:
        notificationDeliveryStatus-in-0:
          destination: notification.delivery.status
          group: ingestion-service-group
          consumer:
            concurrency: 2
            max-attempts: 1
