spring:
  data:
    mongodb:
      uri: mongodb://admin:admin@localhost:27017/comms_platform?authSource=admin&directConnection=true
    redis:
      host: localhost
      port: 6379

  cloud:
    # Consumes the delivery outcome dispatchService publishes, so a NotificationRequest
    # finally moves off RECEIVED to SENT/FAILED.
    function:
      definition: notificationDeliveryStatus
    stream:
      kafka:
        binder:
          # emits Kafka producer/consumer spans and injects traceparent into record headers
          enable-observation: true
          # Topics are provisioned by infra/scripts/kafka-init.sh, which weights partitions by
          # priority (4/3/2/1 x unit) to match consumer concurrency. auto-create stays on as a
          # fallback for a broker that was never initialised.
          #
          # min-partition-count is deliberately NOT set. It applies one floor to every topic, so
          # at 4 it would flatten the weighting - and with auto-add-partitions off, the binder
          # refuses to start against notification.low, which only has one partition by design.
          auto-create-topics: true
          replication-factor: 1
          # StreamBridge sets a String message key; the binder defaults to ByteArraySerializer,
          # which fails every send with "Cant convert key of class java.lang.String"
          producer-properties:
            key.serializer: org.apache.kafka.common.serialization.StringSerializer
          brokers: localhost:9092
      bindings:
        notificationDeliveryStatus-in-0:
          destination: notification.delivery.status
          group: ingestion-service-group
          consumer:
            concurrency: 2
            max-attempts: 1

notification:
  idempotency:
    # How long Redis remembers an Idempotency-Key. Local runs get the short window; the
    # containerised profile in config-repo-github keeps it for three days.
    ttl: 24h
