
server:
  port: 8888

spring:
  application:
    name: configServer
  profiles:
    active: native   # overridden by SPRING_PROFILES_ACTIVE in containers

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,env