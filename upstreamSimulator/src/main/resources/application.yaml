spring:
  application:
    name: upstreamSimulator
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

server:
  port: 8082

comms-platform:
  services:
    ingestionServiceUrl: ${GATEWAY_URL:http://localhost:8080}/ingestionservice/notifications
